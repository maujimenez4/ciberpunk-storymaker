[project]
name = "ciberpunk-storymaker"
version = "0.1.0"
description = "Generacion asistida de novela larga. Backend v1."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "numpy>=2.1",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/app"]

[tool.pytest.ini_options]
testpaths = ["src/backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
src = ["src/backend"]
# .claude/ son skills vendorizadas: SOURCES.md prohibe editar su texto.
extend-exclude = [".claude", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/backend/app"]

# Las seis reglas de dependencia de architecture.md §5.2. Fallan la build (CA-9).
[tool.importlinter]
root_packages = ["app"]
# Necesario para prohibir paquetes externos como fastapi o sqlalchemy.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "regla 2: commons no importa de ninguna feature"
type = "forbidden"
source_modules = ["app.commons"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
name = "regla 3: commons/domain no conoce framework ni base de datos"
type = "forbidden"
source_modules = ["app.commons.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "app.commons.db"]

[[tool.importlinter.contracts]]
name = "regla 1: a obra se entra por su __init__, no por sus ficheros"
type = "forbidden"
source_modules = [
    "app.features.outline",
    "app.features.escena",
    "app.features.contexto",
    "app.features.escritura",
    "app.features.calidad",
    "app.features.canon",
    "app.features.manuscrito",
]
forbidden_modules = [
    "app.features.obra.router",
    "app.features.obra.schemas",
    "app.features.obra.service",
    "app.features.obra.repository",
    "app.features.obra.agents",
]

