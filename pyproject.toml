[project]
name = "ciberpunk-storymaker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9",
  # El extra `asyncio` no es decorativo: arrastra `greenlet`, sin el cual
  # `create_async_engine` falla al primer `connect()`. SQLAlchemy solo lo
  # declara por si mismo bajo un marcador de `platform_machine` que NO
  # incluye `arm64`, asi que en un Mac de Apple Silicon no se instala.
  "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20", "alembic>=1.13",
  # Las dos de la Tarea 1, de las catorce que P-01 aprobo en bloque.
  # `claude-agent-sdk` es el proveedor de modelo (P-08): consumo de cuenta, sin
  # clave de API. Necesita el CLI `claude` instalado y autenticado, y **no lo
  # usa ni un test** (CA-4). `tiktoken` es el contador previo de P-A: un BPE
  # local, que es lo que RF-CTX-02 pide y no una estimacion por caracteres.
  "claude-agent-sdk>=0.2", "tiktoken>=0.8",
  # La de la Tarea 7. Es **opcional de hecho aunque se declare aqui**: lo que
  # aporta son las funciones escalares `vec_*` sobre la columna BLOB que ya
  # existe, y si la extension no carga el sistema arranca igual con el almacen
  # de fuerza bruta (RNF-FIA-02, CA-28). Declararla y no exigirla es lo que
  # impide que sea una segunda base de datos por la puerta de atras.
  "sqlite-vec>=0.1.6",
  # La de la Fase 3, y tambien de las catorce que P-01 aprobo en bloque (spec,
  # Impacto tecnico). `architecture.md` §2 y §5.5 dicen «BLOB + NumPy» desde
  # antes de que el codigo existiera, y el plan 3 resolvio la divergencia a
  # favor del documento. No reintroduce el problema del que huye
  # `AlmacenFuerzaBruta`: `sqlite-vec` es una **extension de SQLite** que puede
  # no cargar en la maquina de destino; NumPy es una dependencia de Python como
  # las otras trece.
  "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27",
       "ruff>=0.7", "mypy>=1.13", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Hace que `app` sea importable de verdad, y no solo bajo pytest: sin esto
# `lint-imports` no encuentra el paquete y la cuarta puerta no corre.
packages = ["src/backend/app"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# ruff 0.16 formatea los bloques de codigo dentro de Markdown. La prosa de este
# repositorio no es codigo: `.claude/skills/` esta clavado a un commit upstream
# con su licencia, y `docs/` y `specs/` contienen a proposito ejemplos
# equivocados que no deben "arreglarse" solos.
extend-exclude = [".claude", "docs", "specs"]

[tool.mypy]
strict = true
files = ["src/backend/app"]
follow_imports = "silent"
# CLAUDE.md §6 exige estricto sobre `commons/domain/` y los `service.py`; se
# aplica a todo el codigo de produccion, que es mas y no menos. Los tests
# quedan fuera: `strict` les exigiria `-> None` en cada funcion, y un test es
# una asercion, no una interfaz. `files` no expande comodines, asi que la
# frontera se traza con `exclude`, que si es una expresion regular.
exclude = ["/tests/", "conftest\\.py$"]

[[tool.mypy.overrides]]
# `sqlite-vec` no trae `py.typed`, y no hay stubs publicados. El alcance del
# silencio es **ese** modulo y nada mas: el resto sigue en estricto.
module = ["sqlite_vec.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["app"]
# El segundo contrato prohibe modulos que no son nuestros (fastapi, sqlalchemy,
# httpx), y import-linter no los mira si no se le dice.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "commons no importa de ninguna feature"
type = "forbidden"
source_modules = ["app.commons"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
name = "commons.domain no conoce el framework ni la base de datos"
type = "forbidden"
source_modules = ["app.commons.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx"]
