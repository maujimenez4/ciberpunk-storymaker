  ["VALIDANDO", "aprobada", "EXTRAYENDO"],
  ["EXTRAYENDO", "paso_completado", "INTEGRADA"],
]
nota = "El modelo abstrae EXTRAYENDO: §3.9 no lo tiene, y no se inventan estados."

[[accion]]
nombre = "Reparar"
codigo = ["app.features.escritura.service.escribir_capitulo"]
transiciones = [
  ["VALIDANDO", "defecto_bloqueante", "REPARANDO"],
  ["REPARANDO", "paso_completado", "ESCRIBIENDO"],
]
nota = "La segunda NO esta en `_TRANSICIONES`: la decide el contador dentro de `maquina.transitar` con intento < 2. Es la decision previa 1 del plan, y desde el 2026-09-24 esta **reclamada** y no solo contada en prosa: el test mide `transitar` por ejecucion."

[[accion]]
nombre = "Escalar"
codigo = [
  "app.features.escritura.maquina.transitar",
  "app.features.escritura.maquina.exigir_que_la_novela_siga",
]
transiciones = [["REPARANDO", "paso_completado", "ESCALADA"]]
nota = "REPARANDO -> ESCALADA con intento >= 2, y `DETIENEN_LA_NOVELA` la convierte en la DETENIDA de §3.9."

[[accion]]
nombre = "Reanudar"
codigo = [
  "app.features.escritura.reanudacion.reanudar",
  "app.features.escritura.reanudacion.descartar",
]
transiciones = []
nota = "Hereda `arranque.intento`: es la linea que impide que una caida regale reintentos (§3.7)."

[[accion]]
nombre = "Verificar"
codigo = [
  "app.features.manuscrito.lean.generar_lean",
  "app.features.manuscrito.lean.correr_lean",
]
transiciones = []
nota = "La puerta entera (RF-FOR-01 a 03): `generar_lean` produce el fichero desde la cronologia y `correr_lean` lo compila. `publicar` la invoca **antes de escribir nada**. Aterrizo el 2026-09-24 en `4c6ff5c`."

[[accion]]
nombre = "Publicar"
codigo = ["app.features.manuscrito.service.publicar"]
transiciones = []
nota = "Crea la `VersionPublicada` inmutable (RF-PUB-01 a 08). Aterrizo con la Fase 4 el 2026-09-24. **Y cumple la guarda de S1 por su cuenta**: `_capitulos_listos` exige `estado == ESTADO_APROBADO` por capitulo y lanza si falta alguno, que es mas fuerte que lo que el modelo puede exhibir (ver §5 del README: alli integrar y validar son el mismo evento)."

[[accion]]
nombre = "LeanFalla"
codigo = ["app.features.manuscrito.service.CronologiaIncoherente"]
transiciones = []
nota = "Si Lean falla, no se publica y el fallo vuelve al editor (CA-21): `publicar` lanza `CronologiaIncoherente` y no llega a crear la version. Y si Lean **no esta instalado**, `correr_lean` lanza `HerramientaNoDisponible` y tampoco se publica: la verificacion formal es eliminatoria, no degradable."

[[accion]]
nombre = "PeticionDelLector"
codigo = [
  "app.features.escritura.peticion.registrar_peticion",
  "app.features.manuscrito.peticiones.marcar_regenerando",
]
transiciones = []
nota = "El estado `regenerando` de `PeticionDeCambio` es el REGENERANDO de §3.9; no hay estado nuevo en la maquina de escena."

[[accion]]
nombre = "RehacerCapitulo"
codigo = [
  "app.features.escritura.peticion.atender_peticion",
  "app.features.escritura.regeneracion.regenerar_capitulo",
]
transiciones = []
nota = "Aterrizo el 2026-09-24 (plan 5 T7) en `escritura` y no en `manuscrito`: `manuscrito -> escritura` cerraria un ciclo entre features. Consolidar y publicar solo si no hay introducidos (RF-PET-06)."

[[accion]]
nombre = "DescartarPeticion"
codigo = [
  "app.features.escritura.regeneracion.retirar_prosa_de_la_corrida",
  "app.features.manuscrito.peticiones.cerrar_peticion",
]
transiciones = []
nota = "No crea version y no toca la vigente (§3.9). Es lo que S3 vigila. La prevision decia `reversion.revertir`, y no era: revertir (RF-PET-08) mueve la vigente a otra tirada, y el modelo no lo tiene. Descartar es retirar la prosa de la corrida y cerrar la peticion `descartada`."

[[accion]]
nombre = "Fin"
codigo = ["app.features.escritura.maquina.ESTADOS_TERMINALES"]
transiciones = []
nota = "Los terminales de §3.3 y los `[*]` de §3.9."

# --------------------------------------------------------------------------
# Transiciones del codigo que NINGUNA accion del modelo reclama, con su motivo.
# Si aparece una nueva sin declarar, el test se pone en rojo.
# --------------------------------------------------------------------------

# Las averias de §3.6 NO pasan por `_TRANSICIONES`: `transitar` las resuelve
# antes, con `if senal in _AVERIAS: return FALLIDA`. Son una **regla**, no
# dieciocho hechos: tres senales que llevan a FALLIDA desde cualquier estado
# vivo. Declararlas una a una obligaria a anadir filas cada vez que naciera un
# estado. El test expande la regla sobre los estados no terminales.
#
# Estuvieron invisibles hasta el 2026-09-24: el test comparaba contra la tabla
# y no contra el comportamiento, asi que la Fase 6 anadio `proceso_interrumpido`
# y nada se puso rojo.
[[sin_accion_regla]]
senales = ["fallo_de_proveedor", "tiempo_agotado", "proceso_interrumpido"]
destino = "FALLIDA"
motivo = "§3.9 no tiene averia tecnica: la maquina de la novela no dibuja FALLIDA. Un capitulo FALLIDA la detiene por la via de `escribir_novela`, que exige INTEGRADA. Declarado, no modelado."

[[sin_accion]]
transicion = ["ENSAMBLANDO", "contexto_excedido", "FALLIDA"]
motivo = "§3.9 no tiene averia tecnica: un capitulo FALLIDA detiene la novela por la via de `escribir_novela`, que exige INTEGRADA. Declarado, no modelado."

[[sin_accion]]
transicion = ["PLANIFICANDO", "cancelacion", "CANCELADA"]
motivo = "La maquina de la novela de §3.9 no tiene cancelacion del Autor."

